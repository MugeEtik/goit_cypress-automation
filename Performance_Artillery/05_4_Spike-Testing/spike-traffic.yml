# Ani patlamalar (Mızrak ucu grafiği)
# Bu test, kısa süreli yüksek trafik patlamalarını simüle eder.
# Bu tür testler, sistemin ani trafik artışlarına nasıl tepki verdiğini görmek için önemlidir.
config:
  target: "https://httpbin.org"             # Test merkezimiz
  phases:                                   # Testin aşamaları (farklı yük seviyeleri veya süreler için) 
    - duration: 30                            # Test 30 saniye sürsün
      arrivalRate: 5                          # Saniyede 5 yeni sanal kullanıcı gönder (30sn x 5 = 150 kullanıcı)
      name: "Spike Traffic Test - Ramp-up"    # Testin adı / Ramp-up aşaması (yükü kademeli artırıyoruz, normal yük seviyesine geliyoruz)
    - duration: 10                            # Test 10 saniye sürsün
      arrivalRate: 100                        # Saniyede 100 yeni sanal kullanıcı gönder (10sn x 100 = 1000 kullanıcı)
      name: "Spike Traffic Test - Spike"      # Testin adı / Spike aşaması (ani patlama, normal yük seviyesinin çok üzerinde)
    - duration: 30                            # Test 30 saniye sürsün
      arrivalRate: 5                          # Saniyede 5 yeni sanal kullanıcı gönder (30sn x 5 = 150 kullanıcı)
      name: "Spike Traffic Test - Ramp-down"  # Testin adı / Ramp-down aşaması (yükü kademeli azaltıyoruz, normal yük seviyesine dönüyoruz)

scenarios:
  - name: "Simple GET check"                 # Senaryo adı
    flow:                                   
      - get:
          url: "/get"                        
      - post:                                  
          url: "/post"   
          json:                                     # Gönderdiğimiz veriyi JSON formatında tanımlayalım
            name: "Artillery"                         # İstekle birlikte gönderilecek veri (örneğin, bir isim)
            type: "Performance Testing"               # İstekle birlikte gönderilecek veri (örneğin, bir tür)  
          headers:                                  # İstekle birlikte gönderilecek başlıklar
            Content-Type: "application/json"          # İçerik türü başlığı, JSON formatında veri gönderdiğimizi belirtir
            Accept: "application/json"                # Kabul edilen içerik türü başlığı, JSON formatında yanıt beklediğimizi belirtir

